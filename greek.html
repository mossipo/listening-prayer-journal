<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akouō · Greek</title>
<meta name="theme-color" content="#F5F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16180F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="greek/greek.css">
</head>
<body>
<!-- Akouō Plus: the Greek Study Desk. Read the Greek of a passage, tap any word for its parsing in plain English.
     Everything shown comes from credited data (see Sources at the foot of the page); nothing is guessed. -->
<header class="top" id="top">
  <div class="bar">
    <a class="back" href="./" id="back">‹ Akouō</a>
    <div class="nav" id="nav" hidden>
      <button type="button" class="arrow" id="prev" aria-label="Previous chapter">‹</button>
      <button type="button" class="pick" id="pick" aria-haspopup="dialog">Greek</button>
      <button type="button" class="arrow" id="next" aria-label="Next chapter">›</button>
    </div>
    <span class="sync" id="sync" role="status" hidden>Saved</span>
  </div>
  <div class="tools" role="toolbar" aria-label="Reading options" id="tools" hidden>
    <div class="seg" role="group" aria-label="View">
      <span class="seg-l">View</span>
      <button type="button" data-view="read" aria-pressed="true">Read</button>
      <button type="button" data-view="structure" aria-pressed="false">Structure</button>
    </div>
    <button type="button" class="tog" id="t-gloss" aria-pressed="true">Glosses</button>
    <button type="button" class="tog st-only" id="t-wdw" aria-pressed="true">Who does what</button>
    <div class="seg rd-only" role="group" aria-label="English (BSB)">
      <span class="seg-l" id="en-l">English</span>
      <button type="button" data-en="under" aria-pressed="true">Under</button>
      <button type="button" data-en="beside" aria-pressed="false">Beside</button>
      <button type="button" data-en="off" aria-pressed="false">Off</button>
    </div>
    <span class="spacer"></span>
    <a class="tog link" id="t-markup" href="markup.html" hidden>Mark up</a>
  </div>
</header>
<div id="warn"></div>
<div class="stage" id="stage">
  <main id="reader" class="reader"><p class="loading">Opening…</p></main>
  <aside id="panel" class="panel" aria-label="Word details" tabindex="-1" hidden></aside>
</div>
<dialog id="picker" aria-labelledby="ptitle">
  <div class="dh"><b id="ptitle">Choose a passage</b><button type="button" id="pclose" aria-label="Close">×</button></div>
  <div class="db" id="pbody"></div>
</dialog>
<script type="module" src="greek/main.js"></script>
</body>
</html>
